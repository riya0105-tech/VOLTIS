services:
  postgres:
    image: postgres:15-alpine
    container_name: voltis_postgres
    restart: always
    environment:
      POSTGRES_DB: voltis
      POSTGRES_USER: voltis
      POSTGRES_PASSWORD: voltis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltis -d voltis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
